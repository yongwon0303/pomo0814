<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setting - Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="setting.css" />
</head>
<body>
  <main class="setting-card">
    <h3>Setting</h3>

    <div class="setting-field">
      <label for="timer-minutes">타이머 시간 (분)</label>
      <input type="number" id="timer-minutes" name="timer-minutes" min="1" max="60" value="25" />
      <p class="setting-notice" id="setting-notice"></p>
    </div>

    <button class="btn-complete" id="save-btn" type="button">설정 완료</button>
    <a class="btn-back" href="index.html">뒤로 가기</a>
  </main>

  <script src="setting.js"></script>
</body>
</html>
